[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "label-vocabulary-gate"
version = "0.1.1"
description = "Offline exact categorical vocabulary membership gate"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
label-vocabulary-gate = "label_vocabulary_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
